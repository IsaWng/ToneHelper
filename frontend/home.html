<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>礼貌表达助手 v0.2</title>
  <style>
    :root{
      --gap:18px;
      --radius:22px;
      --shadow:0 40px 80px rgba(15,23,42,.18);
      --card-bg:rgba(255,255,255,.85);
      --accent:#5964ff;
      --accent-dark:#424bda;
      --text:#0f172a;
      --muted:#5f6c88;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft Yahei,Noto Sans CJK SC,Helvetica,Arial,sans-serif;
      background:
        radial-gradient(circle at 20% 20%,rgba(93,80,255,.35),transparent 50%),
        radial-gradient(circle at 80% 0,rgba(255,116,116,.28),transparent 45%),
        linear-gradient(135deg,#f8f9ff,#eef2ff);
      color:var(--text);
      min-height:100%;
      padding:24px 18px 50px;
    }
    .contenedor{
      width:min(960px,100%);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:20px;
    }
    header{
      display:flex;
      flex-direction:column;
      gap:14px;
      padding:24px;
      border-radius:var(--radius);
      background:var(--card-bg);
      box-shadow:var(--shadow);
      backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.5);
    }
    header h1{
      margin:4px 0 8px;
      font-size:28px;
      letter-spacing:-.02em;
      line-height:1.2;
      color:#0f172a;
    }
    header p{
      margin:0;
      color:var(--muted);
      font-size:16px;
      line-height:1.5;
    }
    .header-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
    }
    .language-switch{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      color:var(--muted);
    }
    .language-switch label{
      margin:0;
      font-size:13px;
      font-weight:600;
      color:#1d2534;
      letter-spacing:.02em;
      display:inline-flex;
      align-items:center;
    }
    .language-switch select{
      font-size:13px;
      padding:8px 12px;
    }
    .hero-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 14px;
      border-radius:999px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--accent-dark);
      background:rgba(95,107,255,.16);
      font-weight:600;
    }
    .estado{
      margin-top:18px;
      font-size:14px;
      color:var(--muted);
    }
    .tarjeta{
      background:var(--card-bg);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
      backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.5);
    }
    label{font-size:13px;font-weight:600;color:#1d2534;display:block;margin-bottom:8px;letter-spacing:.02em}
    textarea{
      width:100%;
      min-height:160px;
      resize:vertical;
      border:1px solid #d6daf2;
      border-radius:18px;
      padding:16px 18px;
      font-size:15px;
      outline:none;
      transition:border-color .2s, box-shadow .2s;
      background:rgba(255,255,255,.92);
      box-sizing:border-box;
    }
    textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(89,100,255,.18);
    }
    .controles{
      display:flex;
      gap:var(--gap);
      align-items:center;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .grupo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .grupo-label{
      font-size:13px;
      font-weight:600;
      color:#1d2534;
      letter-spacing:.02em;
    }
    .btn{
      appearance:none;
      border:0;
      border-radius:16px;
      padding:12px 20px;
      font-size:15px;
      font-weight:600;
      background:var(--accent);
      color:#fff;
      cursor:pointer;
      box-shadow:0 15px 32px rgba(89,100,255,.35);
      transition:transform .15s,box-shadow .15s,background .15s;
    }
    .btn:hover:not([disabled]){
      transform:translateY(-1px);
      box-shadow:0 18px 40px rgba(89,100,255,.45);
      background:var(--accent-dark);
    }
    .btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-sec{
      background:rgba(15,23,42,.07);
      color:#0f172a;
      box-shadow:none;
    }
    select{
      border:1px solid #d6daf2;
      border-radius:14px;
      padding:9px 12px;
      background:rgba(255,255,255,.9);
      font-size:14px;
    }
    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .chip{
      border:1px solid rgba(15,23,42,.15);
      border-radius:18px;
      padding:9px 16px;
      cursor:pointer;
      font-size:13px;
      background:rgba(255,255,255,.7);
      font-weight:500;
      transition:all .2s;
    }
    .chip.activo{
      background:#0f172a;
      color:#fff;
      border-color:#0f172a;
      box-shadow:0 12px 28px rgba(15,23,42,.4);
    }
    .salida{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:var(--gap);
      margin-top:24px;
    }
    .carta{
      border:1px solid rgba(15,23,42,.08);
      border-radius:22px;
      padding:20px;
      background:rgba(255,255,255,.92);
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:170px;
      box-shadow:0 25px 55px rgba(15,23,42,.1);
    }
    .result-meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:12px;
      color:var(--muted);
    }
    .copy-btn{
      appearance:none;
      border:0;
      background:rgba(95,107,255,.15);
      color:var(--accent-dark);
      border-radius:999px;
      padding:6px 14px;
      font-size:12px;
      font-weight:600;
      display:inline-flex;
      align-items:center;
      gap:6px;
      cursor:pointer;
      transition:background .2s;
    }
    .copy-btn svg{width:14px;height:14px}
    .copy-btn:hover{
      background:rgba(95,107,255,.24);
    }
    .contador{font-size:13px;color:#475467;margin-left:auto;font-weight:600}
    .pie{
      font-size:12px;
      color:var(--muted);
      margin-top:32px;
      text-align:center;
    }
    .historial{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .pill{
      font-size:12px;
      border:1px solid rgba(15,23,42,.15);
      border-radius:999px;
      padding:6px 14px;
      background:rgba(255,255,255,.65);
      cursor:pointer;
      max-width:240px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      transition:background .2s;
    }
    .pill:hover{
      background:rgba(95,107,255,.12);
    }
    @media (max-width: 960px){
      body{padding:18px 14px 40px;}
      header, .tarjeta{padding:20px;}
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <header>
      <div class="header-top">
        <div class="hero-pill">ToneHelper · v0.2</div>
        <div class="language-switch">
          <label for="ui-lang" id="ui-lang-label">界面语言</label>
          <select id="ui-lang">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>
      <h1 id="hero-title">让语气更温和，也能保持专业和立场。</h1>
      <p id="hero-desc">贴上 20–300 字的句子或段落，选择语气和语言，ToneHelper 立即生成三种更礼貌、更口语或更简洁的表达。</p>
      <div class="estado" id="estado">就绪 · 支持中/英/西 · Cmd/Ctrl+Enter 生成</div>
    </header>

    <section class="tarjeta">
      <label for="entrada" id="label-entrada">原文</label>
      <textarea id="entrada" placeholder="粘贴或输入 20–300 字的句子或短段落"></textarea>
      <div class="controles">
        <div class="grupo">
          <span class="grupo-label" id="tone-label">语气</span>
          <div class="chips" id="chips-tono">
            <button class="chip activo" data-valor="softer" id="tone-softer">更温和</button>
            <button class="chip" data-valor="colloquial" id="tone-colloquial">更口语</button>
            <button class="chip" data-valor="concise" id="tone-concise">更简洁</button>
          </div>
        </div>
        <div class="grupo">
          <label for="idioma" id="language-label">语言</label>
          <select id="idioma">
            <option value="auto" id="lang-option-auto">自动检测</option>
            <option value="zh" id="lang-option-zh">中文</option>
            <option value="en" id="lang-option-en">English</option>
            <option value="es" id="lang-option-es">Español</option>
          </select>
        </div>
        <div class="contador" id="contador">0/300</div>
        <button id="btn-generar" class="btn">生成</button>
        <button id="btn-limpiar" class="btn btn-sec">清空</button>
      </div>

      <div class="salida" id="salida" aria-live="polite" style="min-height: 40px; margin-top:12px"></div>

      <div class="historial" id="historial"></div>

      <div class="pie" id="footer-text">隐私：仅在本地保存最近 5 条输入以便复用。不开启任何外传。</div>
    </section>
  </div>

  <script>
    // 配置占位 API。部署后可设置 
    window.API_ENDPOINT = "http://localhost:8000/api/rewrite";

    const UI_LANG_KEY = 'tonehelper_ui_lang';
    const SUPPORTED_UI_LANGS = ['zh','en','es'];
    const UI_STRINGS = {
      zh: {
        pageTitle: '礼貌表达助手 v0.2',
        heroTitle: '让语气更温和，也能保持专业和立场。',
        heroDesc: '贴上 20–300 字的句子或段落，选择语气和语言，ToneHelper 立即生成三种更礼貌、更口语或更简洁的表达。',
        statusReady: '就绪 · 支持中/英/西 · Cmd/Ctrl+Enter 生成',
        inputLabel: '原文',
        inputPlaceholder: '粘贴或输入 20–300 字的句子或短段落',
        toneLabel: '语气',
        toneSofter: '更温和',
        toneColloquial: '更口语',
        toneConcise: '更简洁',
        languageLabel: '语言',
        langAuto: '自动检测',
        langChinese: '中文',
        langEnglish: 'English',
        langSpanish: 'Español',
        generate: '生成',
        clear: '清空',
        footer: '隐私：仅在本地保存最近 5 条输入以便复用。不开启任何外传。',
        uiLangLabel: '界面语言',
        errorTooShort: '最少 5 字',
        errorTooLong: '最多 300 字',
        statusCleared: '已清空',
        statusDone: '完成',
        statusCopied: '已复制',
        statusCopyFailed: '复制失败',
        statusError: '生成失败，改用占位结果',
        loading: '正在生成…',
        fallbackError: '生成失败，已使用占位结果',
        defaultReason: '表达更自然',
        copy: '复制'
      },
      en: {
        pageTitle: 'ToneHelper · Polite Rewrite',
        heroTitle: 'Sound kinder while staying professional.',
        heroDesc: 'Paste 20–300 characters, choose tone + language, and get three polished rewrites instantly.',
        statusReady: 'Ready · zh/en/es supported · Cmd/Ctrl+Enter to run',
        inputLabel: 'Original text',
        inputPlaceholder: 'Paste or type a 20–300 character sentence or short paragraph',
        toneLabel: 'Tone',
        toneSofter: 'Softer',
        toneColloquial: 'More casual',
        toneConcise: 'More concise',
        languageLabel: 'Rewrite language',
        langAuto: 'Auto detect',
        langChinese: 'Chinese',
        langEnglish: 'English',
        langSpanish: 'Spanish',
        generate: 'Generate',
        clear: 'Clear',
        footer: 'Privacy: only the last 5 inputs stay in this browser for quick reuse. Nothing leaves your device.',
        uiLangLabel: 'Interface',
        errorTooShort: 'At least 5 characters',
        errorTooLong: 'Up to 300 characters',
        statusCleared: 'Cleared',
        statusDone: 'Done',
        statusCopied: 'Copied',
        statusCopyFailed: 'Copy failed',
        statusError: 'Generation failed, using placeholder',
        loading: 'Working…',
        fallbackError: 'Generation failed, showing placeholder rewrites',
        defaultReason: 'Sounds more natural',
        copy: 'Copy'
      },
      es: {
        pageTitle: 'ToneHelper · Reformular con tacto',
        heroTitle: 'Habla con más tacto sin perder claridad.',
        heroDesc: 'Pega un texto de 20–300 caracteres, elige tono e idioma y recibe tres versiones más amables al instante.',
        statusReady: 'Listo · zh/en/es disponibles · Cmd/Ctrl+Enter para generar',
        inputLabel: 'Texto original',
        inputPlaceholder: 'Pega o escribe una frase o párrafo corto de 20–300 caracteres',
        toneLabel: 'Tono',
        toneSofter: 'Más suave',
        toneColloquial: 'Más coloquial',
        toneConcise: 'Más conciso',
        languageLabel: 'Idioma',
        langAuto: 'Detección automática',
        langChinese: 'Chino',
        langEnglish: 'Inglés',
        langSpanish: 'Español',
        generate: 'Generar',
        clear: 'Limpiar',
        footer: 'Privacidad: guardamos solo las últimas 5 entradas en este navegador para reutilizarlas. Nada sale de tu equipo.',
        uiLangLabel: 'Idioma de la interfaz',
        errorTooShort: 'Mínimo 5 caracteres',
        errorTooLong: 'Máximo 300 caracteres',
        statusCleared: 'Vacío',
        statusDone: 'Listo',
        statusCopied: 'Copiado',
        statusCopyFailed: 'No se pudo copiar',
        statusError: 'Fallo al generar, usamos un ejemplo',
        loading: 'Generando…',
        fallbackError: 'Fallo al generar, mostramos un resultado simulado',
        defaultReason: 'Suena más natural',
        copy: 'Copiar'
      }
    };

    // --- Utilidades ---
    const qs = (s, el=document) => el.querySelector(s);
    const qsa = (s, el=document) => Array.from(el.querySelectorAll(s));
    const byId = id => document.getElementById(id);

    const entrada = byId('entrada');
    const contador = byId('contador');
    const salida = byId('salida');
    const btnGenerar = byId('btn-generar');
    const btnLimpiar = byId('btn-limpiar');
    const selectIdioma = byId('idioma');
    const chipsTono = byId('chips-tono');
    const estado = byId('estado');
    const historial = byId('historial');
    const heroTitle = byId('hero-title');
    const heroDesc = byId('hero-desc');
    const labelEntrada = byId('label-entrada');
    const toneLabel = byId('tone-label');
    const toneSofter = byId('tone-softer');
    const toneColloquial = byId('tone-colloquial');
    const toneConcise = byId('tone-concise');
    const languageLabel = byId('language-label');
    const langOptionAuto = byId('lang-option-auto');
    const langOptionZh = byId('lang-option-zh');
    const langOptionEn = byId('lang-option-en');
    const langOptionEs = byId('lang-option-es');
    const footerText = byId('footer-text');
    const uiLangSelect = byId('ui-lang');
    const uiLangLabel = byId('ui-lang-label');

    let tonoActual = 'softer';
    let uiLang = getInitialUILanguage();
    let lastStatusKey = 'statusReady';

    function getInitialUILanguage(){
      const saved = localStorage.getItem(UI_LANG_KEY);
      if(saved && SUPPORTED_UI_LANGS.includes(saved)) return saved;
      const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      const match = SUPPORTED_UI_LANGS.find(lang=>nav.startsWith(lang));
      return match || 'en';
    }

    function t(key){
      const dict = UI_STRINGS[uiLang] || UI_STRINGS.en;
      return dict[key] || UI_STRINGS.en[key] || key;
    }

    function applyTranslations(){
      const dict = UI_STRINGS[uiLang] || UI_STRINGS.en;
      document.title = dict.pageTitle;
      heroTitle.textContent = dict.heroTitle;
      heroDesc.textContent = dict.heroDesc;
      labelEntrada.textContent = dict.inputLabel;
      entrada.placeholder = dict.inputPlaceholder;
      toneLabel.textContent = dict.toneLabel;
      toneSofter.textContent = dict.toneSofter;
      toneColloquial.textContent = dict.toneColloquial;
      toneConcise.textContent = dict.toneConcise;
      languageLabel.textContent = dict.languageLabel;
      langOptionAuto.textContent = dict.langAuto;
      langOptionZh.textContent = dict.langChinese;
      langOptionEn.textContent = dict.langEnglish;
      langOptionEs.textContent = dict.langSpanish;
      btnGenerar.textContent = dict.generate;
      btnLimpiar.textContent = dict.clear;
      footerText.textContent = dict.footer;
      uiLangLabel.textContent = dict.uiLangLabel;
      if(lastStatusKey){
        estado.textContent = t(lastStatusKey);
      }
    }

    function setUILang(lang){
      if(!SUPPORTED_UI_LANGS.includes(lang)) lang = 'en';
      uiLang = lang;
      localStorage.setItem(UI_LANG_KEY, lang);
      document.documentElement.lang = lang;
      if(uiLangSelect) uiLangSelect.value = lang;
      applyTranslations();
    }

    if(uiLangSelect){
      uiLangSelect.addEventListener('change', (e)=> setUILang(e.target.value));
    }
    setUILang(uiLang);

    // 控件事件
    chipsTono.addEventListener('click', (e)=>{
      if(e.target.classList.contains('chip')){
        qsa('.chip', chipsTono).forEach(c=>c.classList.remove('activo'));
        e.target.classList.add('activo');
        tonoActual = e.target.dataset.valor;
      }
    });

    entrada.addEventListener('input', ()=>{
      const len = entrada.value.trim().length;
      contador.textContent = `${len}/300`;
      if(len>300) contador.style.color = '#c00'; else contador.style.color = '#666';
    });

    btnLimpiar.addEventListener('click', ()=>{
      entrada.value = '';
      contador.textContent = '0/300';
      salida.innerHTML = '';
      notificar('statusCleared');
    });

    // 快捷键
    document.addEventListener('keydown', (e)=>{
      if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='enter'){
        e.preventDefault(); generar();
      }
      if(e.key==='Escape'){
        e.preventDefault(); btnLimpiar.click();
      }
    });

    // 历史记录（最近 5 条）
    const CLAVE_HIST = 'historial_rewrite_v01';
    function cargarHistorial(){
      const items = JSON.parse(localStorage.getItem(CLAVE_HIST)||'[]');
      historial.innerHTML = '';
      items.forEach(txt=>{
        const pill = document.createElement('button');
        pill.className = 'pill';
        pill.title = txt;
        pill.textContent = txt;
        pill.addEventListener('click', ()=>{entrada.value = txt; entrada.dispatchEvent(new Event('input'));});
        historial.appendChild(pill);
      });
    }
    function guardarHistorial(texto){
      let arr = JSON.parse(localStorage.getItem(CLAVE_HIST)||'[]');
      arr = [texto, ...arr.filter(t=>t!==texto)].slice(0,5);
      localStorage.setItem(CLAVE_HIST, JSON.stringify(arr));
      cargarHistorial();
    }

    cargarHistorial();

    // 主流程
    btnGenerar.addEventListener('click', generar);

    async function generar(){
      const texto = entrada.value.trim();
      if(texto.length < 5){
        notificar('errorTooShort');
        return;
      }
      if(texto.length > 300){
        notificar('errorTooLong');
        return;
      }
      const idioma = selectIdioma.value;
      bloquear(true);
      renderCargando();
      try{
        const datos = await llamarAPI(texto, tonoActual, idioma);
        renderResultados(datos);
        guardarHistorial(texto);
        notificar('statusDone');
      }catch(err){
        console.error(err);
        renderError(t('fallbackError'));
        notificar('statusError');
        const datos = await mockGenerar(texto, tonoActual, idioma);
        renderResultados(datos);
      }finally{
        bloquear(false);
      }
    }

    function bloquear(si){
      btnGenerar.disabled = si; btnLimpiar.disabled = si; entrada.disabled = si; selectIdioma.disabled = si;
    }

    function notificar(key){
      if(UI_STRINGS.en[key]){
        lastStatusKey = key;
        estado.textContent = t(key);
      }else{
        lastStatusKey = null;
        estado.textContent = key;
      }
    }

    function renderCargando(){
      salida.innerHTML = `<div class="carta">${escapeHTML(t('loading'))}</div>`;
    }

    function renderError(msg){
      salida.innerHTML = `<div class="carta">${escapeHTML(msg)}</div>`;
    }

    function renderResultados(resp){
      const copyLabel = t('copy');
      const defaultReason = t('defaultReason');
      const tarjetas = resp.rewrites.map((r, i)=>{
        const id = `copiar-${Date.now()}-${i}`;
        return `<div class="carta">
          <div>${escapeHTML(r.text)}</div>
          <div class="result-meta">
            <span>${escapeHTML(r.reason||defaultReason)}</span>
            <button class="copy-btn" data-copiar-id="${id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="3"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              ${copyLabel}
            </button>
          </div>
        </div>`
      }).join('');
      salida.innerHTML = tarjetas;
      // 绑定复制
      qsa('[data-copiar-id]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const carta = btn.closest('.carta');
          const texto = carta.querySelector('div').textContent;
          try{ await navigator.clipboard.writeText(texto); notificar('statusCopied'); }
          catch{ notificar('statusCopyFailed'); }
        });
      });
    }

    function escapeHTML(s){
      return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    // 调用真实/占位 API
    async function llamarAPI(texto, tono, idioma){
      if(!window.API_ENDPOINT) throw new Error('占位模式');
      const res = await fetch(window.API_ENDPOINT, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: texto, tone: tono, lang: idioma })
      });
      if(!res.ok) throw new Error('API 错误 ' + res.status);
      return await res.json();
    }

    // 占位生成：根据语气与语言做最小可用改写，便于前端预览
    async function mockGenerar(texto, tono, idioma){
      const lang = idioma==='auto' ? detectarIdioma(texto) : idioma;
      const fabrica = {
        zh: (t)=> mockZH(t, tono),
        en: (t)=> mockEN(t, tono),
        es: (t)=> mockES(t, tono)
      }[lang] || ((t)=> mockZH(t, tono));
      return { rewrites: fabrica(texto) };
    }

    function detectarIdioma(t){
      // 极简检测：含中文字符则 zh；含西语常见字符/词则 es；默认 en
      if(/[\u4e00-\u9fa5]/.test(t)) return 'zh';
      if(/[ñáéíóú¿¡]/i.test(t) || /(gracias|por favor|hola|vale|perdón)/i.test(t)) return 'es';
      return 'en';
    }

    // ——— 语言占位器 ———
    function mockZH(t, tono){
      const base = t.replace(/[\s\n]+/g,' ').trim();
      const rezones = {
        softer: ['语气缓和','保留边界','减少冲突'],
        colloquial: ['更口语','更自然','更日常'],
        concise: ['更简短','核心保留','去冗余']
      }[tono]||['表达自然'];
      return [
        { text: zhTransform(base, tono, 0), reason: rezones[0] },
        { text: zhTransform(base, tono, 1), reason: rezones[1]||rezones[0] },
        { text: zhTransform(base, tono, 2), reason: rezones[2]||rezones[0] }
      ];
    }
    function zhTransform(s, tono, variante){
      if(tono==='softer'){
        const pref = ['麻烦','请','如果方便的话'][variante]||'请';
        return `${pref} ${s.replace(/^我/g,'我这边')}，谢谢理解。`;
      }
      if(tono==='colloquial'){
        const pref = ['嘿','嗨','嗯'][variante]||'';
        return `${pref ? pref+'，' : ''}${s.replace('无法','不太行').replace('不能','不太能')}，可以吗？`;
      }
      if(tono==='concise'){
        return s.replace(/，?谢谢(理解|配合)?。?$/,'').replace(/请问/g,'请').replace(/麻烦/g,'请').replace(/。?$/,'。');
      }
      return s;
    }

    function mockEN(t, tono){
      const s = t.trim();
      if(tono==='softer') return [
        {text:`Could we ${lowerFirst(s)}? Thanks for understanding.`, reason:'softer tone'},
        {text:`I wonder if we could ${lowerFirst(s)}. Appreciate it.`, reason:'hedging'},
        {text:`If possible, could we ${lowerFirst(s)}? Thank you.`, reason:'polite request'}
      ];
      if(tono==='colloquial') return [
        {text:`Hey, can we ${lowerFirst(s)}?`, reason:'casual'},
        {text:`Mind if we ${lowerFirst(s)}?`, reason:'spoken'},
        {text:`Let’s ${lowerFirst(s)}, ok?`, reason:'direct but friendly'}
      ];
      return [
        {text:`Please ${lowerFirst(s)}.`, reason:'concise'},
        {text:`Let’s ${lowerFirst(s)}.`, reason:'concise'},
        {text:`${capitalize(s)}.`, reason:'shortened'}
      ];
    }

    function mockES(t, tono){
      const s = t.trim();
      if(tono==='softer') return [
        {text:`¿Podríamos ${lowerFirstES(s)}? Gracias por la comprensión.`, reason:'tono suave'},
        {text:`Si es posible, ¿podemos ${lowerFirstES(s)}?`, reason:'condicional'},
        {text:`Te agradecería si ${lowerFirstES(s)}.`, reason:'cortesía'}
      ];
      if(tono==='colloquial') return [
        {text:`Oye, ¿podemos ${lowerFirstES(s)}?`, reason:'coloquial'},
        {text:`¿Te va si ${lowerFirstES(s)}?`, reason:'hablado'},
        {text:`Mejor ${lowerFirstES(s)}, ¿vale?`, reason:'directo amable'}
      ];
      return [
        {text:`Por favor, ${lowerFirstES(s)}.`, reason:'conciso'},
        {text:`${capitalize(s)}.`, reason:'breve'},
        {text:`Procedamos a ${lowerFirstES(s)}.`, reason:'formal breve'}
      ];
    }

    function lowerFirst(str){
      return str.replace(/^\s*(to\s+)?/i,'').replace(/[.]$/,'').replace(/^([A-Z])/, m=>m.toLowerCase());
    }
    function lowerFirstES(str){
      return str.replace(/[.]$/,'').replace(/^([A-ZÁÉÍÓÚÑ])/, m=>m.toLowerCase());
    }
    function capitalize(str){ return str.charAt(0).toUpperCase()+str.slice(1).replace(/[.]$/,''); }
  </script>
